# Rime schema settings
# encoding: utf-8

schema:
  schema_id: stroke_uiojk
  name: "五筆畫 (UIOJK)"
  version: "0.7"
  author:
    - 四季的風
    - 雪齋
    - Kunki Chou
    - 宋天
  description: |
    五筆畫
    u,i,o,j,k 代表橫、豎、撇、點(捺)、折
  dependencies:
    - luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator

speller:
  alphabet: "uiojk"
  delimiter: " '"
  algebra:
    - xlit/hspnz/uiojk/

menu:
  page_size: 9

translator:
  dictionary: stroke_uiojk
  preedit_format:
#   - xlit/uiojk/㇐㇑㇒㇏㇠/   # 中日韓筆畫（橫豎撇捺折）
    - xlit/uiojk/⼀⼁⼃⼂⼄/   # 康熙部首（橫豎撇點折）
  comment_format:
    - xform/~//
#   - xlit/uiojk/㇐㇑㇒㇏㇠/   # 中日韓筆畫（橫豎撇捺折）
    - xlit/uiojk/⼀⼁⼃⼂⼄/   # 康熙部首（橫豎撇點折）
    - xlit/hspnz/⼀⼁⼃⼂⼄/   # 兼容原始碼表註釋

abc_segmentor:
  extra_tags:
    - reverse_lookup

reverse_lookup:
  dictionary: luna_pinyin
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  comment_format:
#   - xlit/hspnz/㇐㇑㇒㇏㇠/   # 中日韓筆畫（橫豎撇捺折）
    - xlit/hspnz/⼀⼁⼃⼂⼄/   # 康熙部首（橫豎撇點折）

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    # 選字確認鍵：/
    - { when: has_menu, accept: "slash", send: "space" }

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
